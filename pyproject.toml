[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cppbuild"
version = "0.1.0"
description = "Python management of independent CMake C++ projects"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["cppbuild*"]
